name: Probe A-share data sources
on:
  push:
    paths:
      - .github/workflows/probe-sources.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe BSE batch conversion
        run: |
          python - <<'PY'
          import akshare as ak
          from datetime import date
          from prepare import fetch_bars
          for code in ['920000','920001','920002','920003','920005']:
              row={'code':code,'board':'BJ'}
              c,b,e=fetch_bars(ak,row,date(2026,10,22),120)
              print('BSE',c,len(b or []),e,flush=True)
          PY
