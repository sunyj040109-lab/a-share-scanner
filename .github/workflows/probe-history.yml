name: Probe Tencent daily history
on:
  push:
    paths: [.github/workflows/probe-history.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          python - <<'PY'
          import akshare as ak
          for code in ('sh600000', 'sz300001', 'bj920001'):
              try:
                  df = ak.stock_zh_a_hist_tx(symbol=code, start_date='20260401', end_date='20261021', timeout=10)
                  print(code, len(df), df.tail(1).to_dict('records'), flush=True)
              except Exception as exc:
                  print(code, type(exc).__name__, str(exc)[:300], flush=True)
          PY
