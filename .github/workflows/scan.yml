name: A-share 14:30 intraday scan

on:
  schedule:
    # Start well before 14:30 Beijing time to absorb GitHub schedule delays.
    - cron: "7 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: a-share-intraday-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check scanner logic
        run: python -m unittest discover -s tests -v
      - name: Scan at 14:30 Beijing time
        id: scan
        shell: bash
        run: |
          python scanner.py --wait-until-window --require-window --status-file "$RUNNER_TEMP/scan-status"
          echo "updated=$(cat "$RUNNER_TEMP/scan-status")" >> "$GITHUB_OUTPUT"
      - name: Save fresh report to repository
        if: steps.scan.outputs.updated == 'true'
        shell: bash
        run: |
          git add REPORT.md docs
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update A-share scan $(date -u +%F)"
          git push
      - name: Upload mobile report and data
        if: always() && steps.scan.outputs.updated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a-share-scan
          path: |
            REPORT.md
            docs/


