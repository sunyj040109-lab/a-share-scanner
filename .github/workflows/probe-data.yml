name: Probe A-share source

on:
  push:
    paths:
      - .github/workflows/probe-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check current source coverage without publishing
        run: |
          python - <<'PY'
          import akshare
          from scanner import fetch_universe
          rows, counts = fetch_universe(akshare)
          print(f"Source rows: {counts}; total: {len(rows)}")
          PY
