name: Probe A-share source

on:
  push:
    paths:
      - .github/workflows/probe-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check Tencent stock coverage without publishing
        run: |
          python - <<'PY'
          import akshare
          frame = akshare.stock_zh_a_spot_tx()
          print('rows', len(frame), 'columns', list(frame.columns))
          print('sample', frame.head(2).to_dict('records'))
          print('code samples', frame['code'].astype(str).head(20).tolist())
          PY
